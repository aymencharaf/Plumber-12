workflows:
  android-apk:
    name: Plumber APK Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - plumber-secrets

      vars:
        PACKAGE_NAME: "com.aistudio.plumber.calculator"

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Verify Gemini API Key
        script: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is missing."
            echo "Add GEMINI_API_KEY to the plumber-secrets group."
            exit 1
          fi

          echo "GEMINI_API_KEY is configured."

      - name: Verify Gradle Wrapper
        script: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          chmod +x ./gradlew

          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar was not found."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties was not found."
            exit 1
          fi

          echo "Gradle Wrapper files found."

      - name: Check Gradle version
        script: |
          ./gradlew --version

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk
